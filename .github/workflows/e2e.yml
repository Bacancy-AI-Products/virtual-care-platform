name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telecare
          POSTGRES_PASSWORD: telecare
          POSTGRES_DB: telecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend
      DATABASE_URL: postgresql://telecare:telecare@localhost:5432/telecare_test
      JWT_SECRET: test-jwt-secret-not-for-production
      PORT: '4001'
      FRONTEND_URL: http://localhost:3000
      # Daily.co — dummy values, video tests are skipped in CI
      DAILY_API_KEY: dummy-key-for-ci
      DAILY_DOMAIN: dummy.daily.co
      # SMTP — not used in tests
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_USER: test
      SMTP_PASS: test
      MAIL_FROM: test@telecare.test
      # Frontend
      NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
      # Playwright
      CI: 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------- Backend ----------------
      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Generate Prisma client + run migrations
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Seed database
        working-directory: backend
        run: npm run seed

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ---------------- Frontend ----------------
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      # ---------------- Run E2E ----------------
      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      # ---------------- Artifacts on failure ----------------
      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
