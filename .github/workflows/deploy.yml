name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  # ── Job 1: Run Tests ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  # ── Job 2: Deploy to EC2 ──────────────────────────
  # Required secrets: EC2_HOST, EC2_USERNAME, EC2_SSH_KEY, APP_ENV_FILE
  # APP_ENV_FILE must contain: DATABASE_URL, DB_NAME, DB_USER, DB_PASSWORD, NEXT_PUBLIC_API_URL
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/my-app
            test -f docker-compose.yml || { echo "Error: docker-compose.yml not found in $(pwd)"; exit 1; }

            git pull origin main

            echo '${{ secrets.APP_ENV_FILE }}' > .env

            docker compose down --remove-orphans
            docker compose up -d --build --force-recreate

            # Deploy DB: apply migrations (one-off container)
            docker compose run --rm app npx prisma migrate deploy

            # Push seed data (one-off container)
            docker compose run --rm app npx prisma db seed

            docker compose ps
            docker image prune -f

