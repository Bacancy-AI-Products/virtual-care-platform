<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-label="Online doctor consultation illustration">
  <defs>
    <radialGradient id="hero-bg" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#fff8f4"/>
      <stop offset="55%" stop-color="#fff8f4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="row-scroll-clip">
      <rect x="98" y="16" width="106" height="50"/>
    </clipPath>
    <style><![CDATA[
      @keyframes float-a { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes float-b { 0%, 100% { transform: translateY(0); }  50% { transform: translateY(9px); } }
      @keyframes float-c { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes ecg-trace { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -180; } }
      @keyframes heart-beat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.15); } 60% { transform: scale(0.95); } }
      @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-3px); opacity: 1; } }
      @keyframes blink-eye { 0%, 88%, 100% { transform: scaleY(1); } 92%, 96% { transform: scaleY(0.08); } }
      @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.6); opacity: 0; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.15; } }
      @keyframes cta-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes notif-slide {
        0%, 4%, 100% { transform: translateY(-40px); opacity: 0; }
        10%, 38% { transform: translateY(0); opacity: 1; }
        44% { transform: translateY(-40px); opacity: 0; }
      }
      @keyframes wifi-pulse { 0%, 70%, 100% { opacity: 0.2; } 25%, 50% { opacity: 1; } }
      @keyframes scroll-rows { from { transform: translateY(0); } to { transform: translateY(-48px); } }

      .anim-float-a { animation: float-a 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-float-b { animation: float-b 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-float-c { animation: float-c 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-blink { animation: blink 1.4s ease-in-out infinite; }
      .anim-ecg { stroke-dasharray: 60 120; animation: ecg-trace 2.4s linear infinite; }
      .anim-heart-beat { animation: heart-beat 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-typing { animation: typing-bounce 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-typing-2 { animation-delay: 0.2s; }
      .anim-typing-3 { animation-delay: 0.4s; }
      .anim-eye { animation: blink-eye 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-ring { animation: pulse-ring 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-ring-2 { animation-delay: 1.1s; }
      .anim-twinkle { animation: twinkle 3s ease-in-out infinite; }
      .anim-twinkle-2 { animation-delay: 0.5s; }
      .anim-twinkle-3 { animation-delay: 1s; }
      .anim-twinkle-4 { animation-delay: 1.5s; }
      .anim-twinkle-5 { animation-delay: 2s; }
      .anim-twinkle-6 { animation-delay: 2.5s; }
      .anim-cta-pulse { animation: cta-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-notif { animation: notif-slide 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-wifi-1 { animation: wifi-pulse 1.6s ease-in-out infinite; }
      .anim-wifi-2 { animation: wifi-pulse 1.6s ease-in-out infinite 0.2s; }
      .anim-wifi-3 { animation: wifi-pulse 1.6s ease-in-out infinite 0.4s; }
      .anim-scroll-rows { animation: scroll-rows 7s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-float-a, .anim-float-b, .anim-float-c,
        .anim-blink, .anim-ecg, .anim-heart-beat, .anim-typing,
        .anim-eye, .anim-ring, .anim-twinkle, .anim-cta-pulse,
        .anim-notif, .anim-wifi-1, .anim-wifi-2, .anim-wifi-3,
        .anim-scroll-rows { animation: none; }
      }
    ]]></style>
  </defs>

  <!-- Soft spotlight backdrop (fades to white at the edges) -->
  <circle cx="400" cy="480" r="420" fill="url(#hero-bg)"/>

  <!-- Decorative dots (twinkling, staggered) -->
  <circle class="anim-twinkle" cx="100" cy="180" r="6" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-2" cx="710" cy="160" r="10" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-3" cx="60" cy="500" r="5" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-4" cx="740" cy="540" r="7" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-5" cx="120" cy="860" r="8" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-6" cx="700" cy="880" r="6" fill="#f58220"/>

  <!-- Floating icon: Plus (top-left) -->
  <g transform="translate(150, 280)">
    <g class="anim-float-a">
      <circle r="40" fill="#ffffff"/>
      <circle r="40" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path d="M-15 0 H15 M0 -15 V15" stroke="#f58220" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating icon: Heart (top-right) -->
  <g transform="translate(660, 260)">
    <g class="anim-float-b">
      <circle r="42" fill="#ffffff"/>
      <circle r="42" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path class="anim-heart-beat" d="M0 16 C-22 -4, -28 -24, -12 -24 C-5 -24, 0 -19, 0 -13 C0 -19, 5 -24, 12 -24 C28 -24, 22 -4, 0 16 Z" fill="#f58220"/>
    </g>
  </g>

  <!-- Floating icon: Chat (bottom-right) with typing dots -->
  <g transform="translate(660, 740)">
    <g class="anim-float-c">
      <circle r="40" fill="#ffffff"/>
      <circle r="40" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path d="M-20 -10 Q-20 -16, -14 -16 H14 Q20 -16, 20 -10 V8 Q20 14, 14 14 H-2 L-10 22 L-10 14 H-14 Q-20 14, -20 8 Z" fill="#f58220"/>
      <circle class="anim-typing" cx="-9" cy="-1" r="2.5" fill="#ffffff"/>
      <circle class="anim-typing anim-typing-2" cx="0" cy="-1" r="2.5" fill="#ffffff"/>
      <circle class="anim-typing anim-typing-3" cx="9" cy="-1" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Laptop centerpiece -->
  <g transform="translate(400, 500)">
    <!-- Laptop hinge / base -->
    <rect x="-240" y="118" width="480" height="14" rx="7" fill="#7c3e10"/>
    <path d="M-220 118 L220 118 L210 98 L-210 98 Z" fill="#bc5a0e"/>

    <!-- Screen frame -->
    <rect x="-220" y="-180" width="440" height="278" rx="12" fill="#1f2937"/>
    <rect x="-210" y="-170" width="420" height="248" rx="6" fill="#ffffff"/>

    <!-- Browser top bar -->
    <rect x="-210" y="-170" width="420" height="22" fill="#fff8f4"/>
    <circle cx="-196" cy="-159" r="3.5" fill="#ef4444"/>
    <circle cx="-186" cy="-159" r="3.5" fill="#f59e0b"/>
    <circle cx="-176" cy="-159" r="3.5" fill="#10b981"/>
    <rect x="-150" y="-162" width="180" height="6" rx="3" fill="#ffd4b8"/>

    <!-- Wifi indicator (right side of browser bar) -->
    <g transform="translate(190, -157)">
      <circle cx="0" cy="3" r="0.8" fill="#f58220"/>
      <path class="anim-wifi-1" d="M -2 1 Q 0 -1 2 1" stroke="#f58220" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path class="anim-wifi-2" d="M -4.5 -1 Q 0 -4 4.5 -1" stroke="#f58220" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      <path class="anim-wifi-3" d="M -7 -3 Q 0 -7 7 -3" stroke="#f58220" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Main video panel -->
    <rect x="-200" y="-138" width="284" height="208" rx="8" fill="#fff8f4"/>

    <!-- LIVE badge -->
    <rect x="-190" y="-128" width="46" height="18" rx="9" fill="#ef4444"/>
    <circle class="anim-blink" cx="-180" cy="-119" r="3" fill="#ffffff"/>
    <rect x="-172" y="-122" width="20" height="6" rx="2" fill="#ffffff"/>

    <!-- Doctor figure on screen -->
    <ellipse cx="-60" cy="-44" rx="30" ry="32" fill="#1f2937"/>
    <circle cx="-60" cy="-40" r="26" fill="#ffd4b8"/>
    <path d="M-86 -48 Q-86 -68, -60 -68 Q-34 -68, -34 -48 Q-34 -54, -46 -54 Q-60 -54, -68 -52 Q-86 -52, -86 -48 Z" fill="#1f2937"/>
    <circle cx="-74" cy="-32" r="3" fill="#f58220" opacity="0.45"/>
    <circle cx="-46" cy="-32" r="3" fill="#f58220" opacity="0.45"/>
    <circle class="anim-eye" cx="-68" cy="-42" r="2" fill="#1f2937"/>
    <circle class="anim-eye" cx="-52" cy="-42" r="2" fill="#1f2937"/>
    <path d="M-66 -28 Q-60 -22, -54 -28" stroke="#1f2937" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- White coat -->
    <path d="M-114 70 Q-114 -8, -60 -14 Q-6 -8, -6 70 Z" fill="#ffffff"/>
    <path d="M-114 70 Q-114 -8, -60 -14 Q-6 -8, -6 70" stroke="#f58220" stroke-width="2.5" fill="none"/>
    <path d="M-80 -10 L-60 18 L-40 -10" stroke="#f58220" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

    <!-- Stethoscope -->
    <path d="M-72 4 Q-78 26, -68 38" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-48 4 Q-42 26, -52 38" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-60" cy="42" r="6" fill="#f58220" stroke="#1f2937" stroke-width="2"/>

    <!-- Right side: appointment panel -->
    <rect x="98" y="-128" width="104" height="46" rx="6" fill="#fff8f4"/>
    <circle cx="116" cy="-105" r="11" fill="#f58220"/>
    <rect x="132" y="-110" width="60" height="6" rx="3" fill="#bc5a0e"/>
    <rect x="132" y="-100" width="44" height="5" rx="2.5" fill="#ffd4b8"/>

    <rect x="98" y="-74" width="104" height="44" rx="6" fill="#fff8f4"/>
    <path class="anim-ecg" d="M104 -52 L116 -52 L120 -64 L126 -42 L132 -58 L138 -48 L142 -52 H198" stroke="#f58220" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CTA button (gentle pulse) -->
    <g class="anim-cta-pulse">
      <rect x="98" y="-22" width="104" height="32" rx="16" fill="#f58220"/>
      <circle cx="122" cy="-6" r="7" fill="#ffffff"/>
      <path d="M119 -9 L126 -6 L119 -3 Z" fill="#f58220"/>
      <rect x="136" y="-10" width="52" height="6" rx="3" fill="#ffffff"/>
    </g>

    <!-- Scrolling rows (clipped, repeating pattern) -->
    <g clip-path="url(#row-scroll-clip)">
      <g class="anim-scroll-rows">
        <rect x="98" y="20" width="104" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="32" width="84" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="44" width="92" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="56" width="72" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="68" width="104" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="80" width="84" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="92" width="92" height="6" rx="3" fill="#ffd4b8"/>
        <rect x="98" y="104" width="72" height="6" rx="3" fill="#ffd4b8"/>
      </g>
    </g>
  </g>

  <!-- Phone in foreground (bottom-left) -->
  <g transform="translate(220, 760) rotate(-10)">
    <rect x="-46" y="-94" width="92" height="188" rx="18" fill="#1f2937"/>
    <rect x="-40" y="-86" width="80" height="166" rx="6" fill="#ffffff"/>
    <rect x="-12" y="-86" width="24" height="6" rx="3" fill="#1f2937"/>

    <!-- Pulse rings (active call indicator, behind avatar) -->
    <circle class="anim-ring" cx="0" cy="-50" r="20" stroke="#f58220" stroke-width="2" fill="none"/>
    <circle class="anim-ring anim-ring-2" cx="0" cy="-50" r="20" stroke="#f58220" stroke-width="2" fill="none"/>

    <!-- Mini doctor avatar -->
    <circle cx="0" cy="-50" r="20" fill="#fff8f4"/>
    <ellipse cx="0" cy="-56" rx="14" ry="14" fill="#ffd4b8"/>
    <path d="M-14 -56 Q-14 -72, 0 -72 Q14 -72, 14 -56 Q14 -62, 4 -62 Q0 -62, -6 -60 Q-14 -60, -14 -56 Z" fill="#1f2937"/>
    <circle cx="-5" cy="-58" r="1.5" fill="#1f2937"/>
    <circle cx="5" cy="-58" r="1.5" fill="#1f2937"/>
    <path d="M-3 -50 Q0 -47, 3 -50" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <rect x="-30" y="-22" width="60" height="6" rx="3" fill="#f58220"/>
    <rect x="-22" y="-10" width="44" height="4" rx="2" fill="#ffd4b8"/>

    <rect x="-30" y="14" width="60" height="28" rx="14" fill="#f58220"/>
    <rect x="-16" y="24" width="32" height="8" rx="4" fill="#ffffff"/>

    <rect x="-30" y="50" width="60" height="4" rx="2" fill="#ffd4b8"/>
    <rect x="-30" y="60" width="48" height="4" rx="2" fill="#ffd4b8"/>
    <rect x="-30" y="70" width="56" height="4" rx="2" fill="#ffd4b8"/>

    <!-- Notification banner (slides in from top, drawn last so it overlays everything) -->
    <g class="anim-notif">
      <rect x="-36" y="-78" width="72" height="20" rx="6" fill="#ffffff" stroke="#ffd4b8" stroke-width="1"/>
      <rect x="-36" y="-78" width="72" height="20" rx="6" fill="#ffffff" stroke="#ffd4b8" stroke-width="1" opacity="0.95"/>
      <circle cx="-26" cy="-68" r="5" fill="#f58220"/>
      <path d="M-28 -69 V-67 M-26 -71 V-65 M-24 -69 V-67" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
      <rect x="-18" y="-72" width="38" height="3" rx="1.5" fill="#bc5a0e"/>
      <rect x="-18" y="-66" width="30" height="2.5" rx="1.25" fill="#ffd4b8"/>
    </g>
  </g>
</svg>
