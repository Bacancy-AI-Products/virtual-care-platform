<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none" role="img" aria-label="Welcome back patient portal illustration">
  <defs>
    <radialGradient id="auth-bg" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#ffb380"/>
    </linearGradient>
    <style><![CDATA[
      @keyframes float-a { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes float-b { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
      @keyframes float-c { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes float-d { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
      @keyframes twinkle { 0%, 100% { opacity: 0.6; } 50% { opacity: 0.15; } }
      @keyframes blink-eye { 0%, 88%, 100% { transform: scaleY(1); } 92%, 96% { transform: scaleY(0.08); } }
      @keyframes heart-beat { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.2); } 60% { transform: scale(0.95); } }
      @keyframes ecg-trace {
        0% { stroke-dashoffset: 220; }
        80%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes cta-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes ring-pulse { 0% { transform: scale(0.95); opacity: 0.5; } 100% { transform: scale(1.35); opacity: 0; } }

      .anim-float-a { animation: float-a 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-float-b { animation: float-b 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-float-c { animation: float-c 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-float-d { animation: float-d 5.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-twinkle { animation: twinkle 3s ease-in-out infinite; }
      .anim-twinkle-2 { animation-delay: 0.5s; }
      .anim-twinkle-3 { animation-delay: 1s; }
      .anim-twinkle-4 { animation-delay: 1.5s; }
      .anim-twinkle-5 { animation-delay: 2s; }
      .anim-twinkle-6 { animation-delay: 2.5s; }
      .anim-eye { animation: blink-eye 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-heart-beat { animation: heart-beat 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-ecg { stroke-dasharray: 220; stroke-dashoffset: 220; animation: ecg-trace 3s linear infinite; }
      .anim-badge-rotate { animation: badge-rotate 14s linear infinite; transform-box: fill-box; transform-origin: center; }
      .anim-cta-pulse { animation: cta-pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-ring-pulse { animation: ring-pulse 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .anim-ring-pulse-2 { animation-delay: 1.3s; }

      @media (prefers-reduced-motion: reduce) {
        .anim-float-a, .anim-float-b, .anim-float-c, .anim-float-d,
        .anim-twinkle, .anim-eye, .anim-heart-beat, .anim-ecg,
        .anim-badge-rotate, .anim-cta-pulse, .anim-ring-pulse { animation: none; }
        .anim-ecg { stroke-dashoffset: 0; }
      }
    ]]></style>
  </defs>

  <circle cx="400" cy="500" r="420" fill="url(#auth-bg)"/>

  <!-- Twinkling dots -->
  <circle class="anim-twinkle" cx="100" cy="200" r="6" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-2" cx="710" cy="180" r="9" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-3" cx="60" cy="540" r="5" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-4" cx="740" cy="560" r="7" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-5" cx="130" cy="860" r="8" fill="#f58220"/>
  <circle class="anim-twinkle anim-twinkle-6" cx="700" cy="880" r="6" fill="#f58220"/>

  <!-- Floating: Stethoscope -->
  <g transform="translate(140, 240)">
    <g class="anim-float-a">
      <circle r="44" fill="#ffffff"/>
      <circle r="44" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path d="M-12 -16 Q-18 0, -12 12 Q0 22, 8 14" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M12 -16 Q18 0, 12 12" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-12" cy="-16" r="3.5" fill="#1f2937"/>
      <circle cx="12" cy="-16" r="3.5" fill="#1f2937"/>
      <circle cx="14" cy="18" r="7" fill="#f58220" stroke="#1f2937" stroke-width="2"/>
    </g>
  </g>

  <!-- Floating: Heart -->
  <g transform="translate(660, 220)">
    <g class="anim-float-b">
      <circle r="46" fill="#ffffff"/>
      <circle r="46" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path class="anim-heart-beat" d="M0 18 C-24 -4, -30 -26, -14 -26 C-6 -26, 0 -20, 0 -14 C0 -20, 6 -26, 14 -26 C30 -26, 24 -4, 0 18 Z" fill="#f58220"/>
    </g>
  </g>

  <!-- Floating: Calendar -->
  <g transform="translate(680, 770)">
    <g class="anim-float-c">
      <circle r="44" fill="#ffffff"/>
      <circle r="44" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <rect x="-15" y="-10" width="30" height="22" rx="3" fill="#f58220"/>
      <rect x="-15" y="-14" width="30" height="8" rx="2" fill="#bc5a0e"/>
      <rect x="-11" y="-18" width="3" height="8" rx="1" fill="#1f2937"/>
      <rect x="8" y="-18" width="3" height="8" rx="1" fill="#1f2937"/>
      <circle cx="-6" cy="2" r="2" fill="#ffffff"/>
      <circle cx="0" cy="2" r="2" fill="#ffffff"/>
      <circle cx="6" cy="2" r="2" fill="#ffffff"/>
      <circle cx="-6" cy="8" r="2" fill="#ffffff"/>
      <circle cx="0" cy="8" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Floating: Chat / message bubble -->
  <g transform="translate(130, 800)">
    <g class="anim-float-d">
      <circle r="42" fill="#ffffff"/>
      <circle r="42" fill="none" stroke="#ffd4b8" stroke-width="2"/>
      <path d="M-18 -10 H18 Q22 -10, 22 -6 V8 Q22 12, 18 12 H-4 L-12 18 V12 H-18 Q-22 12, -22 8 V-6 Q-22 -10, -18 -10 Z" fill="#f58220"/>
      <circle cx="-8" cy="1" r="2" fill="#ffffff"/>
      <circle cx="0" cy="1" r="2" fill="#ffffff"/>
      <circle cx="8" cy="1" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Centerpiece: Welcome-back patient card, tilted -->
  <g transform="translate(400, 510) rotate(-3)">
    <!-- Card shadow -->
    <rect x="-176" y="-282" width="352" height="568" rx="20" fill="#000000" opacity="0.06"/>
    <!-- Card body -->
    <rect x="-180" y="-290" width="360" height="580" rx="20" fill="#ffffff" stroke="#ffd4b8" stroke-width="2"/>

    <!-- Brand header bar -->
    <path d="M-180 -270 H180 V-180 H-180 Z" fill="url(#header-grad)"/>
    <rect x="-180" y="-290" width="360" height="20" rx="20 20 0 0" fill="url(#header-grad)"/>
    <!-- Decorative corner shapes on header -->
    <circle cx="160" cy="-260" r="40" fill="#ffffff" opacity="0.12"/>
    <circle cx="120" cy="-200" r="28" fill="#ffffff" opacity="0.10"/>

    <!-- Mini brand mark in header -->
    <g transform="translate(-148, -240)">
      <rect x="-16" y="-16" width="32" height="32" rx="8" fill="#ffffff"/>
      <path d="M-6 0 H6 M0 -6 V6" stroke="#f58220" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- "Welcome back" placeholder lines on header -->
    <rect x="-114" y="-252" width="160" height="10" rx="5" fill="#ffffff"/>
    <rect x="-114" y="-236" width="100" height="6" rx="3" fill="#ffffff" opacity="0.7"/>

    <!-- Avatar (overlaps header) -->
    <g transform="translate(0, -160)">
      <!-- Pulse rings (live presence) -->
      <circle class="anim-ring-pulse" r="56" fill="none" stroke="#f58220" stroke-width="3" opacity="0.45"/>
      <circle class="anim-ring-pulse anim-ring-pulse-2" r="56" fill="none" stroke="#f58220" stroke-width="3" opacity="0.45"/>
      <!-- Outer white ring -->
      <circle r="54" fill="#ffffff" stroke="#f58220" stroke-width="4"/>
      <!-- Face -->
      <circle r="42" fill="#ffd4b8"/>
      <!-- Hair -->
      <path d="M-36 -8 Q-42 -42, 0 -42 Q42 -42, 36 -8 Q36 -22, 24 -26 Q14 -28, 0 -28 Q-14 -28, -24 -26 Q-36 -22, -36 -8 Z" fill="#1f2937"/>
      <!-- Cheeks -->
      <circle cx="-22" cy="6" r="5" fill="#f58220" opacity="0.4"/>
      <circle cx="22" cy="6" r="5" fill="#f58220" opacity="0.4"/>
      <!-- Eyebrows -->
      <path d="M-18 -14 Q-12 -18, -6 -14" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M6 -14 Q12 -18, 18 -14" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- Eyes -->
      <circle class="anim-eye" cx="-12" cy="-4" r="3" fill="#1f2937"/>
      <circle class="anim-eye" cx="12" cy="-4" r="3" fill="#1f2937"/>
      <!-- Smile -->
      <path d="M-10 12 Q0 22, 10 12" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <!-- Verified badge with rotating dashed orbit -->
      <g transform="translate(36, 36)">
        <g class="anim-badge-rotate">
          <circle r="18" fill="none" stroke="#ffd4b8" stroke-width="2" stroke-dasharray="3 4"/>
        </g>
        <circle r="13" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
        <path d="M-6 0 L-2 4 L6 -4" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Name + meta -->
    <rect x="-90" y="-90" width="180" height="11" rx="5.5" fill="#1f2937"/>
    <rect x="-60" y="-72" width="120" height="6" rx="3" fill="#bc5a0e"/>

    <!-- Stat row: 3 mini cards -->
    <g transform="translate(0, 0)">
      <!-- Heart-rate card -->
      <g transform="translate(-110, 0)">
        <rect x="-48" y="-30" width="96" height="80" rx="12" fill="#fff8f4" stroke="#ffd4b8" stroke-width="1.5"/>
        <path class="anim-heart-beat" d="M0 -10 C-10 -20, -16 -28, -8 -28 C-3 -28, 0 -25, 0 -22 C0 -25, 3 -28, 8 -28 C16 -28, 10 -20, 0 -10 Z" fill="#ef4444"/>
        <rect x="-26" y="-2" width="52" height="9" rx="4" fill="#1f2937"/>
        <rect x="-22" y="14" width="44" height="5" rx="2" fill="#bc5a0e"/>
        <rect x="-20" y="26" width="40" height="4" rx="2" fill="#ffd4b8"/>
        <rect x="-16" y="36" width="32" height="4" rx="2" fill="#ffd4b8"/>
      </g>

      <!-- Vitals/ECG card -->
      <g transform="translate(0, 0)">
        <rect x="-48" y="-30" width="96" height="80" rx="12" fill="#fff8f4" stroke="#ffd4b8" stroke-width="1.5"/>
        <path class="anim-ecg" d="M-40 5 L-30 5 L-24 -8 L-18 14 L-12 -10 L-6 8 L0 5 L40 5" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="-30" y="20" width="60" height="6" rx="3" fill="#1f2937"/>
        <rect x="-22" y="32" width="44" height="4" rx="2" fill="#ffd4b8"/>
      </g>

      <!-- Next visit card -->
      <g transform="translate(110, 0)">
        <rect x="-48" y="-30" width="96" height="80" rx="12" fill="#fff8f4" stroke="#ffd4b8" stroke-width="1.5"/>
        <rect x="-16" y="-22" width="32" height="24" rx="3" fill="#f58220"/>
        <rect x="-16" y="-26" width="32" height="9" rx="2" fill="#bc5a0e"/>
        <rect x="-12" y="-30" width="3" height="8" rx="1" fill="#1f2937"/>
        <rect x="9" y="-30" width="3" height="8" rx="1" fill="#1f2937"/>
        <circle cx="-7" cy="-12" r="1.6" fill="#ffffff"/>
        <circle cx="0" cy="-12" r="1.6" fill="#ffffff"/>
        <circle cx="7" cy="-12" r="1.6" fill="#ffffff"/>
        <rect x="-30" y="10" width="60" height="6" rx="3" fill="#1f2937"/>
        <rect x="-22" y="22" width="44" height="4" rx="2" fill="#bc5a0e"/>
        <rect x="-18" y="32" width="36" height="4" rx="2" fill="#ffd4b8"/>
      </g>
    </g>

    <!-- "Last visit" message bar -->
    <g transform="translate(0, 110)">
      <rect x="-160" y="-22" width="320" height="48" rx="14" fill="#fff8f4" stroke="#ffd4b8" stroke-width="1.5"/>
      <circle cx="-138" cy="2" r="14" fill="#f58220"/>
      <path d="M-144 -4 L-132 -4 Q-129 -4, -129 -1 V5 Q-129 8, -132 8 H-138 L-141 12 V8 H-144 Q-147 8, -147 5 V-1 Q-147 -4, -144 -4 Z" fill="#ffffff"/>
      <rect x="-110" y="-6" width="200" height="7" rx="3.5" fill="#1f2937"/>
      <rect x="-110" y="6" width="160" height="5" rx="2.5" fill="#ffd4b8"/>
    </g>

    <!-- CTA: Continue -->
    <g transform="translate(0, 200)">
      <g class="anim-cta-pulse">
        <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#f58220"/>
        <rect x="-50" y="-4" width="80" height="8" rx="4" fill="#ffffff"/>
        <path d="M38 -4 L48 0 L38 4 Z" fill="#ffffff"/>
      </g>
    </g>

    <!-- Decorative bottom links -->
    <rect x="-90" y="262" width="180" height="5" rx="2.5" fill="#ffd4b8"/>
    <rect x="-60" y="274" width="120" height="5" rx="2.5" fill="#ffd4b8"/>
  </g>
</svg>
